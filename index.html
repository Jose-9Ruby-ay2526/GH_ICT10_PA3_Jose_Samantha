
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby Club Membership</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            background: #fff0f5;
            font-family: Arial, sans-serif;
            color: #9c496b;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: #fffafa;
            padding: 35px;
            border: 2px solid #ffc9dc;
            border-radius: 25px;
            box-shadow: 0 5px 15px #f5dce6;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f5c4d7;
            padding-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #a34c70;
        }

        .tag {
            background: #fff0f5;
            border: 1px solid #f7c4d8;
            border-radius: 20px;
            padding: 10px;
            font-size: 11px;
        }

        .heading {
            margin-top: 30px;
        }

        .heading h1 {
            font-size: 38px;
            margin: 10px 0;
        }

        .heading span {
            color: #e77ca5;
        }

        p {
            color: #a66a83;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 22px 0 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            border: 1.5px solid #f4bdd3;
            border-radius: 15px;
            background: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e77ca5;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: #e982aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d96e98;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border: 1.5px solid #f7c4d8;
            border-radius: 18px;
            background: #fff3f7;
            min-height: 100px;
        }

        .result h3 {
            margin-top: 0;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #b68a9c;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>🎀 Ruby Club</h2>
            <div class="tag">💗 MEMBER CHECKER</div>
        </div>

        <div class="heading">
            <p>— MEMBER ACCESS</p>
            <h1>Add a new <span>member.</span></h1>
            <p>Enter the student's name below to add them to the club.</p>
        </div>

        <label for="fname">First name</label>
        <input type="text" id="fname" placeholder="e.g. Samantha">

        <label for="lname">Last name</label>
        <input type="text" id="lname" placeholder="e.g. Jose">

        <button py-click="add_member">Add member →</button>

        <div class="result">
            <h3>✨ Result:</h3>
            <div id="output">
                Your membership result will appear here.
            </div>
        </div>

    </div>

    <div class="footer">
        Made with 💗 for Ruby Club
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
